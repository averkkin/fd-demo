<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FACEDIGITAL — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap">
<style>
  :root { --accent: #F04E23; --ink: #141414; --muted: #6b6b6b; --line: #ececec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  .site { display: block; max-width: 1440px; margin: 0 auto; }
  .site img { display: block; width: 100%; height: auto; }

  .note {
    position: fixed; left: 24px; bottom: 24px; z-index: 5;
    width: 340px; padding: 20px 20px 18px;
    background: #fff; color: var(--ink);
    border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.12), 0 0 0 1px var(--line);
    font: 400 14px/1.45 Manrope, system-ui, -apple-system, sans-serif;
    transition: opacity .2s, transform .2s;
  }
  .note.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }
  .label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .label::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
  .note p { margin: 0 0 14px; font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
  .asks { display: flex; flex-direction: column; gap: 6px; }
  .ask {
    all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 12px; background: #f5f5f5; font-size: 13px; color: var(--ink);
  }
  .ask:hover { background: #eee; }
  .ask:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ask span:last-child { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ask.done span:last-child { color: var(--accent); }
  .close {
    all: unset; cursor: pointer; position: absolute; top: 14px; right: 14px;
    width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); font-size: 18px;
  }
  .close:hover { background: #f2f2f2; color: var(--ink); }
  .close:focus-visible { outline: 2px solid var(--accent); }

  @media (max-width: 720px) {
    .note { left: 12px; right: 88px; bottom: 16px; width: auto; padding: 14px 14px 12px; border-radius: 16px; }
    .note p { font-size: 14px; margin-bottom: 10px; }
    .asks { display: none; }
    .close { top: 8px; right: 8px; }
  }
</style>
</head>
<body>
  <main class="site" aria-label="Главная страница facedigital.ru">
    <picture>
      <source media="(max-width: 720px)" srcset="site-mobile.jpg">
      <img src="site-desktop.jpg" alt="Главная страница facedigital.ru">
    </picture>
  </main>

  <aside class="note" id="note" aria-label="О демо">
    <button class="close" type="button" aria-label="Скрыть" id="close">×</button>
    <div class="label">демо для FACEDIGITAL</div>
    <p>Так будет работать онлайн-менеджер на вашем сайте. Напишите ему в чат справа — как клиент.</p>
    <div class="asks">
      <button class="ask" type="button"><span>Бюджет 30 тысяч, хочу Директ — реально?</span><span>копировать</span></button>
      <button class="ask" type="button"><span>Стоматология, сайт старый. Сколько выйдет всё?</span><span>копировать</span></button>
      <button class="ask" type="button"><span>Какую скидку вы дали ЖК Семья?</span><span>копировать</span></button>
    </div>
  </aside>

  <script>
    document.getElementById('close').addEventListener('click', function () {
      document.getElementById('note').classList.add('hidden');
    });
    document.querySelectorAll('.ask').forEach(function (b) {
      b.addEventListener('click', function () {
        var text = b.firstElementChild.textContent;
        var mark = function () {
          b.classList.add('done'); b.lastElementChild.textContent = 'скопировано';
          setTimeout(function () { b.classList.remove('done'); b.lastElementChild.textContent = 'копировать'; }, 1600);
        };
        try { navigator.clipboard.writeText(text).then(mark, function () {}); } catch (e) {}
      });
    });
  </script>
  <script async src="https://cabinet.richat.ru/widget/loader.js" data-richat-key="rch_pk_384ab0a3b4a371d8fe48e92a42dc504b"></script>
</body>
</html>
