<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Демо ИИ-помощника для FACEDIGITAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap">
<style>
  :root { --accent: #F04E23; --ink: #141414; --paper: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f3f3f3; font-family: Manrope, system-ui, -apple-system, sans-serif; color: var(--ink); }
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--ink); color: #fff;
    padding: 12px 16px; display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap;
    font-size: 15px; line-height: 1.35; box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }
  .tag { background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .bar b { font-weight: 700; }
  .try { opacity: .8; font-size: 14px; }
  .try q { quotes: "«" "»"; }
  .site { display: block; width: 100%; max-width: 1440px; margin: 0 auto; }
  .site img { display: block; width: 100%; height: auto; }
  @media (max-width: 720px) { .bar { font-size: 14px; } .try { display: none; } }
</style>
</head>
<body>
  <div class="bar" role="note">
    <span class="tag">Демо</span>
    <span><b>ИИ-помощник для FACEDIGITAL</b> — откройте чат справа внизу и спросите как клиент.</span>
    <span class="try">Например: <q>Бюджет 30 тысяч, хочу Директ — реально?</q> или <q>Сколько стоит сайт и реклама для стоматологии?</q></span>
  </div>

  <main class="site" aria-label="Снимок главной страницы facedigital.ru">
    <picture>
      <source media="(max-width: 720px)" srcset="site-mobile.jpg">
      <img src="site-desktop.jpg" alt="Главная страница facedigital.ru (снимок для демонстрации)">
    </picture>
  </main>

  <script async src="https://cabinet.richat.ru/widget/loader.js" data-richat-key="rch_pk_384ab0a3b4a371d8fe48e92a42dc504b"></script>
</body>
</html>
